# SPDX-License-Identifier: GPL-3.0-or-later
#
# release: on a `v*` tag, builds the binaries (Linux x86_64/aarch64 musl,
# macOS, Windows) with a `.sha256` beside each, publishes the GitHub release
# and the multi-arch image at ghcr.io/porecatu/relay (ADR-0005).
#
# Actions are pinned by commit SHA with the readable version in the comment
# beside it, like ci.yml. The Rust version comes from the `toolchain:` input,
# the same value as `channel` in rust-toolchain.toml (ADR-0007).
#
# The Linux binaries are built natively (x86_64 on an x86_64 runner, aarch64
# on an arm64 runner) against musl-gcc, so no cross-compilation tool is
# needed. The image is assembled from those same binaries (Dockerfile target
# `runtime-prebuilt`), so there is no emulated compilation.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: check tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A tag that does not match Cargo.toml would publish a binary whose
      # --version disagrees with the release name.
      - name: Tag matches Cargo.toml
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          crate="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "$version" != "$crate" ]; then
            echo "tag $TAG does not match Cargo.toml version $crate" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  binaries:
    name: binary (${{ matrix.target }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.98.0"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      # `ring` compiles C and assembly; musl-gcc is the C compiler and the
      # linker for the static musl targets.
      - name: musl toolchain
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - name: Build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [[ "$TARGET" == *linux-musl ]]; then
            underscored="${TARGET//-/_}"
            upper="$(echo "$underscored" | tr '[:lower:]' '[:upper:]')"
            export "CC_${underscored}=musl-gcc"
            export "CARGO_TARGET_${upper}_LINKER=musl-gcc"
          fi
          cargo build --release --locked --target "$TARGET"

      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.check.outputs.version }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          name="porecatu-relay-${VERSION}-${TARGET}"
          mkdir -p "dist/${name}"
          exe="porecatu-relay"
          if [ "$ARCHIVE" = "zip" ]; then exe="porecatu-relay.exe"; fi
          cp "target/${TARGET}/release/${exe}" "dist/${name}/"
          cp LICENSE README.md docs/reference/relay.example.toml packaging/porecatu-relay.service "dist/${name}/"
          cd dist
          if [ "$ARCHIVE" = "zip" ]; then
            7z a -tzip "${name}.zip" "${name}"
            file="${name}.zip"
          else
            tar -czf "${name}.tar.gz" "${name}"
            file="${name}.tar.gz"
          fi
          # shasum on macOS, sha256sum elsewhere; same output format.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${file}" > "${file}.sha256"
          else
            shasum -a 256 "${file}" > "${file}.sha256"
          fi
          cat "${file}.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  release:
    name: github release
    needs: [check, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      # Notes come from the CHANGELOG section of this version; without one,
      # GitHub generates them from the commits.
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          flags=()
          if [ -s notes.md ]; then
            flags+=(--notes-file notes.md)
          else
            flags+=(--generate-notes)
          fi
          # A version with a hyphen (0.2.0-rc.1) is a pre-release.
          if [[ "$VERSION" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" "${flags[@]}" dist/*

  image:
    name: container image
    needs: [check, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*-linux-musl
          path: dist/archives
          merge-multiple: true

      # Lays the Linux binaries out the way the Dockerfile's runtime-prebuilt
      # target expects (dist/<TARGETARCH>/porecatu-relay).
      - name: Unpack binaries
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          for pair in amd64:x86_64 arm64:aarch64; do
            arch="${pair%%:*}"
            cpu="${pair##*:}"
            name="porecatu-relay-${VERSION}-${cpu}-unknown-linux-musl"
            (cd dist/archives && sha256sum --check "${name}.tar.gz.sha256")
            mkdir -p "dist/${arch}"
            tar -xzf "dist/archives/${name}.tar.gz" --strip-components=1 -C "dist/${arch}" "${name}/porecatu-relay"
          done
          ls -l dist/amd64 dist/arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # X.Y.Z and X.Y; `latest` is skipped for pre-release tags (the default
      # of the action's `latest=auto`).
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/porecatu/relay
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.licenses=GPL-3.0-or-later
            org.opencontainers.image.source=https://github.com/porecatu/relay

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime-prebuilt
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
