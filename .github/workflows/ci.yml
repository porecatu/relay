name: ci

# Build, test, clippy and fmt on the three platforms; cargo-deny, cargo-audit
# and the documentation check on Linux (ADR-0007). The musl targets belong to
# the release job, not here.
#
# Actions are pinned by commit SHA with the readable version in the comment
# beside it: a major tag is a movable pointer. Dependabot updates SHA and
# comment together.
#
# `dtolnay/rust-toolchain` is pinned by SHA like the others, but that only
# fixes the action's code. The Rust version comes from the `toolchain:` input,
# set to the same value as `channel` in rust-toolchain.toml (ADR-0007).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Daily, so that a new RUSTSEC advisory shows up without anyone pushing.
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A scheduled run never cancels: the daily audit signal must not be lost.
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-deny

      - name: Licenses, sources and bans
        run: cargo deny check

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-audit

      - name: RUSTSEC advisories
        run: cargo audit

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Documentation links
        run: python3 scripts/verify-docs.py
