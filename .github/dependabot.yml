version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # Sensitive dependencies are pinned to an exact version (ADR-0007); a bump
  # PR is the prompt to read the changelog and run the integration tests, not
  # something to merge blindly.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # The host_id is derived with blake2 in porecatu-protocol: both
      # repositories move to a new minor together, by hand.
      - dependency-name: blake2
        versions: [">= 0.11"]
      # Must be the version axum resolves; they go up with axum, by hand.
      - dependency-name: tungstenite
      - dependency-name: tokio-tungstenite
