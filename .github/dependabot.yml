version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # Sensitive dependencies are pinned to an exact version (ADR-0007); a bump
  # PR is the prompt to read the changelog and run the integration tests, not
  # something to merge blindly.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
